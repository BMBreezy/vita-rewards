<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>VITA Rewards</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f6faf8;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding: max(25px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom));}main{max-width:480px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:800;letter-spacing:2px;color:#8ce9af;font-size:15px}small,.muted{color:#a8b7c0;font-size:13px}h1{font-size:23px;margin:0 0 5px}.panel{background:#18252e;border:1px solid #2c3c46;border-radius:22px;padding:22px;margin:14px 0}.center{text-align:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#a8b7c0;font-weight:700}.balance{font-size:48px;line-height:1.2;font-weight:800;color:#8ce9af;margin:8px 0;font-variant-numeric:tabular-nums}.clock{font-size:48px;font-weight:750;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:12px 0 20px}.buttons{display:flex;gap:10px}button{font:inherit;font-weight:700;border:0;border-radius:12px;background:#293b46;color:white;padding:15px;cursor:pointer;touch-action:manipulation}button.primary{background:#8ce9af;color:#10251a}button:disabled{opacity:.35;cursor:default}.buttons button{flex:1}.wide{width:100%;margin-top:10px}#status{min-height:20px;color:#8ce9af;font-size:13px;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#18252e;border:1px solid #2c3c46;padding:16px;border-radius:16px}.stat b{display:block;font-size:26px;margin-top:5px}.history{list-style:none;padding:0;margin:8px 0 0}.history li{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #2c3c46}.history li:last-child{border:0}.history b{font-size:14px}.history small{display:block;margin-top:4px}.credit{color:#8ce9af}.debit{color:#f5ba91}h2{font-size:16px;margin:0 0 10px}.foot{text-align:center;font-size:12px;color:#a8b7c0;margin-top:20px}a{color:#8ce9af}#progress{height:5px;background:#293b46;border-radius:5px;overflow:hidden;margin-top:12px}#bar{height:100%;background:#8ce9af;width:0;transition:width .2s}summary{cursor:pointer;color:#a8b7c0;font-size:13px}details button{font-size:13px;padding:9px;margin:8px 6px 0 0}input{display:none}
</style></head><body><main><header><div><div class="brand">VITA × GTA VI</div><small>Earn your playtime.</small></div></header><div class="panel center"><div class="eyebrow">AVAILABLE GAMING TIME</div><div class="balance" id="balance">0 min</div><small>1 minute studied = 1 minute earned</small></div><div class="panel center"><div class="eyebrow" id="mode">STUDY SESSION</div><div class="clock" id="clock">00:00:00</div><div class="buttons"><button class="primary" id="study">Start studying</button><button id="game">Start gaming</button></div><button class="wide" id="stop" disabled>End session</button><div id="status" role="status"></div></div><div class="stats"><div class="stat"><small>Studied today</small><b id="today">0m</b></div><div class="stat"><small>Studied this week</small><b id="week">0m</b></div><div class="stat"><small>Lifetime study</small><b id="total">0m</b></div><div class="stat"><small>Lifetime gaming</small><b id="spent">0m</b></div></div><div class="panel"><h2>Session history</h2><ul class="history" id="history"></ul></div><details><summary>Data &amp; backup</summary><small id="saveStatus"></small><div><button id="export">Export backup</button><button id="import">Restore backup</button><input type="file" id="file" accept="application/json"></div></details><div class="foot">Your time bank stays on this device. No account required.</div></main><script>
const KEY='vita-rewards-v2', $=id=>document.getElementById(id);let state={sessions:[],active:null},message='';let saved=true;try{let raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)}catch(e){saved=false}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saved=true}catch(e){saved=false} $('saveStatus').textContent=saved?'Saved on this device. Export a backup to keep a separate copy.':'Storage unavailable. Export a backup before closing.'}function totals(){return state.sessions.reduce((a,s)=>(a[s.kind]+=s.seconds,a),{study:0,game:0})}function elapsed(){return state.active?Math.max(0,Math.floor((Date.now()-state.active.start)/1000)):0}function bank(){let t=totals();return Math.max(0,t.study-t.game+(state.active?.kind==='study'?elapsed():state.active?.kind==='game'?-elapsed():0))}function fmt(n){return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')}function short(n){let m=Math.floor(n/60);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'}function finish(auto=false){if(!state.active)return;let a=state.active,e=elapsed();if(a.kind==='game'){let t=totals();e=Math.min(e,Math.max(0,t.study-t.game))}if(e>0)state.sessions.push({kind:a.kind,start:a.start,seconds:e});state.active=null;message=auto?'Gaming time exhausted. Time to study!':a.kind==='study'?'Earned '+fmt(e)+' of gaming time!':'Gaming session logged.';save();render()}function start(kind){if(state.active||kind==='game'&&bank()<=0)return;state.active={kind,start:Date.now()};message='';save();render()}function studySince(start){let end=Date.now();return state.sessions.concat(state.active?.kind==='study'?[{kind:'study',start:state.active.start,seconds:elapsed()}]:[]).filter(s=>s.kind==='study').reduce((n,s)=>n+Math.max(0,Math.floor((Math.min(end,s.start+s.seconds*1000)-Math.max(start,s.start))/1000)),0)}function render(){if(state.active?.kind==='game'&&bank()<=0){finish(true);return}let b=bank(),e=elapsed(),t=totals();$('balance').textContent=Math.floor(b/60)+' min '+String(b%60).padStart(2,'0')+'s';$('mode').textContent=state.active?.kind==='game'?'GAMING TIME LEFT':'STUDY SESSION';$('clock').textContent=fmt(state.active?.kind==='game'?b:e);$('study').disabled=!!state.active;$('game').disabled=!!state.active||b<=0;$('stop').disabled=!state.active;$('status').textContent=message;let d=new Date();d.setHours(0,0,0,0);$('today').textContent=short(studySince(+d));d.setDate(d.getDate()-(d.getDay()+6)%7);$('week').textContent=short(studySince(+d));$('total').textContent=short(t.study+(state.active?.kind==='study'?e:0));$('spent').textContent=short(t.game+(state.active?.kind==='game'?e:0));}function history(){let list=$('history');list.replaceChildren();if(!state.sessions.length){let li=document.createElement('li');li.textContent='No sessions yet. Time to earn your first minute.';li.className='muted';list.append(li);return}for(let s of state.sessions.slice().reverse().slice(0,50)){let li=document.createElement('li'),left=document.createElement('div'),name=document.createElement('b'),date=document.createElement('small'),val=document.createElement('b');name.textContent=s.kind==='study'?'VITA study':'GTA VI';date.textContent=new Date(s.start).toLocaleString();left.append(name,date);val.textContent=(s.kind==='study'?'+':'−')+fmt(s.seconds);val.className=s.kind==='study'?'credit':'debit';li.append(left,val);list.append(li)}}let oldSave=save;save=function(){oldSave();history()};$('study').onclick=()=>start('study');$('game').onclick=()=>start('game');$('stop').onclick=()=>finish();$('export').onclick=()=>{let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));link.download='vita-rewards-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let next=JSON.parse(await $('file').files[0].text());if(!Array.isArray(next.sessions)||!next.sessions.every(s=>['study','game'].includes(s.kind)&&Number.isFinite(s.start)&&Number.isFinite(s.seconds)&&s.seconds>=0)||!(next.active===null||(['study','game'].includes(next.active?.kind)&&Number.isFinite(next.active.start))))throw Error();if(confirm('Replace current session history with this backup?')){state=next;save();render()}}catch{alert('Invalid backup file.')} $('file').value=''};save();render();setInterval(render,500);document.addEventListener('visibilitychange',render);
</script></body></html>
